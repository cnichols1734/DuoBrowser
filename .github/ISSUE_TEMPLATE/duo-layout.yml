{
  "name": "Camera-cutout layout problem",
  "description": "Report wasted width or a control obscured by the camera.",
  "labels": [
    "duo layout"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Do not post credentials, personal browsing data or exploitable vulnerabilities. For vulnerabilities, follow SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Layout problem",
        "description": "Describe the affected control, camera overlap or wasted space. Include a public URL or minimal synthetic fixture."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Environment",
        "description": "App commit/version, Xcode/iOS version, simulator or hardware, and display pose."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Evidence and verification",
        "description": "Reproduction steps and redacted screenshots. State whether Original Layout changes the result; distinguish tested behavior from assumptions."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I removed personal data and this is not a private vulnerability report.",
            "required": true
          }
        ]
      }
    }
  ]
}
